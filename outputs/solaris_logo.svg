<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Solaris Agentic AI Logo</title>
  <desc id="desc">Solaris wordmark with a solar energy symbol and agentic orbit.</desc>
  <defs>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="48%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#168A52"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E62A2"/>
      <stop offset="100%" stop-color="#16A36A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1220" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="42" fill="#F8FBF8"/>

  <g transform="translate(84 54)" filter="url(#softShadow)">
    <circle cx="126" cy="126" r="104" fill="#FFFFFF" stroke="#DDE8DD" stroke-width="3"/>
    <circle cx="126" cy="126" r="52" fill="url(#solar)"/>
    <path d="M126 18V48M126 204V234M18 126H48M204 126H234M49.6 49.6L70.8 70.8M181.2 181.2L202.4 202.4M202.4 49.6L181.2 70.8M70.8 181.2L49.6 202.4" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
    <path d="M59 154c28-20 53-27 78-19 23 7 41 2 57-13" fill="none" stroke="#0B7A4B" stroke-width="14" stroke-linecap="round"/>
    <path d="M63 177c30-15 61-17 94-7 17 5 34 3 52-5" fill="none" stroke="#1E62A2" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="126" cy="126" rx="116" ry="56" fill="none" stroke="url(#orbit)" stroke-width="8" opacity="0.9" transform="rotate(-24 126 126)"/>
    <circle cx="226" cy="80" r="13" fill="#1E62A2"/>
  </g>

  <g transform="translate(352 104)">
    <text x="0" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" fill="#0B1220" letter-spacing="0">Solaris</text>
    <text x="4" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#168A52" letter-spacing="1.5">AGENTIC AI SOLAR ASSISTANT</text>
    <path d="M8 158H654" stroke="#D7E4D7" stroke-width="4" stroke-linecap="round"/>
    <text x="4" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" fill="#5B6472">Observe. Reason. Approve. Act. Verify. Learn.</text>
  </g>
</svg>
